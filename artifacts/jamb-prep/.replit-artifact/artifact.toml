kind = "web"
previewPath = "/"
title = "JAMB Prep App"
version = "1.0.0"
id = "artifacts/jamb-prep"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20529
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/jamb-prep run dev"

[services.env]
PORT = "20529"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/jamb-prep", "run", "build"]
publicDir = "artifacts/jamb-prep/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
