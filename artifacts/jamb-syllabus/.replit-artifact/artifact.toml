kind = "web"
previewPath = "/syllabus/"
title = "JAMB Syllabus Guide"
version = "1.0.0"
id = "artifacts/jamb-syllabus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 26190
name = "web"
paths = ["/syllabus/"]

[services.development]
run = "pnpm --filter @workspace/jamb-syllabus run dev"

[services.env]
PORT = "26190"
BASE_PATH = "/syllabus/"

[services.production]
build = ["pnpm", "--filter", "@workspace/jamb-syllabus", "run", "build"]
publicDir = "artifacts/jamb-syllabus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
